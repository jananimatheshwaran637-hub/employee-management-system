{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">


    <div class="text-center mb-4">

        <h2 class="fw-bold">
            Welcome, {{ request.user.username }}
        </h2>

        <p class="text-muted">
            Employee Management Dashboard
        </p>

    </div>



    <div class="row g-4">


        <!-- Total Employees -->

        <div class="col-md-4">

            <div class="card shadow border-0 text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Employees
                    </h5>

                    <h1 class="text-primary">
                        {{ total_employees }}
                    </h1>

                    <i class="bi bi-people-fill fs-1 text-primary"></i>

                </div>

            </div>

        </div>



        <!-- Employee List -->

        <div class="col-md-4">

            <div class="card shadow border-0 text-center">

                <div class="card-body">

                    <h5>
                        Manage Employees
                    </h5>


                    <a href="{% url 'employee_list' %}" 
                       class="btn btn-primary mt-3">

                        View Employees

                    </a>


                </div>

            </div>

        </div>




        <!-- Add Employee -->

        <div class="col-md-4">

            <div class="card shadow border-0 text-center">

                <div class="card-body">

                    <h5>
                        Add New Employee
                    </h5>


                    <a href="{% url 'add_employee' %}"
                       class="btn btn-success mt-3">

                        Add Employee

                    </a>


                </div>

            </div>

        </div>


    </div>



</div>


{% endblock %}
