{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">


<style>

body{
    height:100vh;
    background:linear-gradient(135deg,#0d6efd,#6610f2);
    display:flex;
    align-items:center;
    justify-content:center;
}


.login-card{

    width:400px;
    padding:35px;

    background:white;

    border-radius:15px;

    box-shadow:0 10px 30px rgba(0,0,0,0.3);

}


.logo{

    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;

}


.form-control{

    padding:12px;
    border-radius:8px;

}


.login-btn{

    width:100%;
    padding:12px;

    background:#0d6efd;
    color:white;

    border:none;
    border-radius:8px;

    font-size:16px;

}


.login-btn:hover{

    background:#084298;

}


.error{

    color:red;
    text-align:center;

}

</style>

</head>


<body>


<div class="login-card">


<div class="logo">

<h2>
<i class="bi bi-people-fill"></i>
</h2>

<h3>
Employee Management
</h3>

</div>



{% if messages %}

{% for message in messages %}

<p class="error">
{{ message }}
</p>

{% endfor %}

{% endif %}




<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Username
</label>

<input 
type="text"
name="username"
class="form-control"
placeholder="Enter username"
required>

</div>



<div class="mb-3">

<label class="form-label">
Password
</label>

<input 
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>



<button class="login-btn">

<i class="bi bi-box-arrow-in-right"></i>
Login

</button>


</form>


</div>


</body>
</html>
